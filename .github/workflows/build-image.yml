---

# Builds one image directory (<dir>/Dockerfile, built with the repository root
# as context) natively for amd64 and arm64, publishes the multi-arch image and
# attaches build provenance and SBOM attestations.
#
# Tags: on main (push, schedule, manual run) <upstream version>-belfry.<n>
# and latest; on pull requests pr-<number>; manual runs on other branches a
# tag named after the branch.

name: Build image

on:
  workflow_call:
    inputs:
      dir:
        description: Directory with the Dockerfile; also the image name
        required: true
        type: string
      description:
        description: OCI image description
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    name: Build ${{ matrix.platform }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.dir }}
    steps:
      - uses: actions/checkout@v4

      - name: Read versions
        id: info
        run: ./scripts/image-info.sh "${{ inputs.dir }}" | tee -a "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        env:
          DESCRIPTION: ${{ inputs.description }}
          VERSION: ${{ steps.info.outputs.tag }}
        run: |
          docker buildx build \
            --pull \
            --platform=${{ matrix.platform }} \
            --file="${{ inputs.dir }}/Dockerfile" \
            --label=org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label=org.opencontainers.image.revision=${GITHUB_SHA} \
            --label=org.opencontainers.image.version="${VERSION}" \
            --label=org.opencontainers.image.created="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label=org.opencontainers.image.description="${DESCRIPTION}" \
            --label=org.opencontainers.image.licenses=Apache-2.0 \
            --label=org.opencontainers.image.vendor="Belfry project" \
            --output=type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true \
            --metadata-file=metadata.json \
            .
          digest=$(jq -r '."containerimage.digest"' metadata.json)
          mkdir -p digests
          touch "digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ inputs.dir }}-${{ strategy.job-index }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    name: Publish multi-arch tags
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.dir }}
    steps:
      - uses: actions/checkout@v4

      - name: Read versions
        id: info
        run: ./scripts/image-info.sh "${{ inputs.dir }}" | tee -a "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digest-${{ inputs.dir }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        env:
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VERSION: ${{ steps.info.outputs.tag }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            tag="pr-${PR_NUMBER}"
            echo "tags=--tag=${IMAGE}:${tag}" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_NAME" = "main" ]; then
            tag="${VERSION}"
            echo "tags=--tag=${IMAGE}:${tag} --tag=${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            tag="${GITHUB_REF_NAME//\//-}"
            echo "tags=--tag=${IMAGE}:${tag}" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Create and push the multi-arch image
        working-directory: digests
        env:
          DESCRIPTION: ${{ inputs.description }}
        run: |
          docker buildx imagetools create \
            ${{ steps.tags.outputs.tags }} \
            --annotation="index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation="index:org.opencontainers.image.description=${DESCRIPTION}" \
            --annotation="index:org.opencontainers.image.licenses=Apache-2.0" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Get the image digest
        id: digest
        run: |
          docker buildx imagetools inspect "${IMAGE}:${{ steps.tags.outputs.tag }}"
          digest=$(docker buildx imagetools inspect "${IMAGE}:${{ steps.tags.outputs.tag }}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Published \`${IMAGE}:${{ steps.tags.outputs.tag }}@${digest}\`" >> "$GITHUB_STEP_SUMMARY"

      # Signed statement of which repository, commit and workflow built the image.
      # Verify with: gh attestation verify oci://<image> --owner belfry-project
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.digest.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Attest SBOM
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

