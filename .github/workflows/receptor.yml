---

name: receptor

on:
  push:
    branches: [main]
    paths:
      - receptor/**
      - scripts/**
      - .github/workflows/receptor.yml
      - .github/workflows/build-image.yml
  pull_request:
    paths:
      - receptor/**
      - scripts/**
      - .github/workflows/receptor.yml
      - .github/workflows/build-image.yml
  schedule:
    # Weekly rebuild to pick up UBI and Python package updates
    - cron: '23 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: receptor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read versions
        id: info
        run: ./scripts/image-info.sh receptor | tee -a "$GITHUB_OUTPUT"

      - name: Check out receptor ${{ steps.info.outputs.upstream_version }}
        uses: actions/checkout@v4
        with:
          repository: ansible/receptor
          ref: ${{ steps.info.outputs.upstream_commit }}
          path: src
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.info.outputs.go_version }}
          cache: false

      - name: Upgrade Go modules
        working-directory: src
        run: ../scripts/upgrade-go-modules.sh ../receptor/go-upgrades.txt

      # Some tests (kubernetes work units) need a cluster, as in upstream CI
      - uses: helm/kind-action@v1
        with:
          cluster_name: receptor-test

      - name: Run the unit tests
        working-directory: src
        env:
          VERSION: ${{ steps.info.outputs.upstream_version }}
        run: make test VERSION="${VERSION#v}"

  build:
    needs: test
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      dir: receptor
      description: Receptor (ansible/receptor) rebuilt with current Go and Go modules for Belfry
